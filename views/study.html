<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Study session — OTTECHIES Flashcards</title>
    <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="../css/study.css">
  <link rel="stylesheet" href="../css/shared.css">
  
  <script defer src="../js/theme.js"></script>
  <script defer src="../js/study.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html" aria-label="OTTECHIES Flashcards home">
      <img src="OTTECHIES (1).jpg" alt="OTTECHIES Logo" class="brand-mark">
      <span class="brand-copy">
        <strong>OTECHS</strong>
        <small>FLASHCARDS</small>
      </span>
    </a>
    <div class="topbar-actions">
      <a class="text-link" href="../index.html">Exit session</a>
      <button class="icon-button" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme"><span data-theme-icon>☾</span></button>
    </div>
  </header>
  <main class="study-shell">
    <div class="study-topline">
      <div><p class="section-kicker">FOCUS MODE</p><h1 id="lecture-title">Study session</h1><p id="course-title" class="muted"></p></div>
      <div class="progress-summary"><strong id="progress-label">Card 1 of 1</strong><span id="progress-percent">0% complete</span></div>
    </div>
    <div class="progress-track" aria-label="Session progress"><span id="progress-bar"></span></div>

    <section class="flashcard-stage">
      <div class="card-meta"><span id="topic-chip" class="topic-chip">FLASHCARD</span><span class="flip-hint">Select the card to reveal the answer ↻</span></div>
      <button id="flashcard" class="flashcard" type="button" aria-label="Reveal answer">
        <span class="flashcard-face flashcard-front">
          <span class="face-label">QUESTION <span>01</span></span>
          <span id="question-text" class="question-text">Your question will appear here.</span>
          <span class="face-foot">Think through your answer before revealing.</span>
        </span>
        <span class="flashcard-face flashcard-back">
          <span class="face-label">ANSWER <span>↻</span></span>
          <span id="answer-text" class="answer-text"></span>
          <span id="rationale-text" class="rationale-text" hidden></span>
          <span class="face-foot">How well did you remember it?</span>
        </span>
      </button>

      <div class="rating-area">
        <p id="rating-prompt" class="muted">Reveal the answer to rate your recall.</p>
        <div id="rating-buttons" class="rating-buttons is-disabled">
          <button class="rating-button rating-fail" data-rating="fail" type="button" disabled><span class="rating-symbol">×</span><span><strong>Need practice</strong><small>Not yet clear</small></span></button>
          <button class="rating-button rating-okay" data-rating="okay" type="button" disabled><span class="rating-symbol">~</span><span><strong>Almost there</strong><small>Remembered some</small></span></button>
          <button class="rating-button rating-perfect" data-rating="perfect" type="button" disabled><span class="rating-symbol">✓</span><span><strong>Got it</strong><small>Remembered well</small></span></button>
        </div>
      </div>
      <div class="study-bottom"><span id="deck-label">Your deck</span><span>Tip: explain the answer in your own words.</span></div>
    </section>
  </main>
</body>
</html>
